  # -----------------------------------------------------------------
  # Cost (COST)
  # -----------------------------------------------------------------
  - id: REQ-SI-COST-001
    type: cost
    statement: >-
      Per-session token budgets are tiered by analysis profile and
      user-configurable. Budget overflow triggers compact-and-retry
      once per response, then an explicit budget-exceeded abort with a
      clear report.
    fit_criterion: >-
      Budget accounting is recorded per session; the overflow path is
      exercised with a mocked provider.
    metric: tokens per session
    threshold: "quick <= 30000, standard <= 100000, deep <= 400000 (configurable defaults)"
    verification: test/offline/test_budget_overflow.py
    priority: Must
    tradeoff: >-
      Owner states cost is not a primary concern (R4 item 5); budgets
      retained as generous safety rails. No global monthly ceiling in
      v1.
    source: "Owner requirements discussion R4 item 5"
    status: conceptual
    depends_on: [REQ-SI-FR-020]
    regression_trigger: true
    regression_scope: [test/offline/test_budget_overflow.py]

  - id: REQ-SI-COST-002
    type: cost
    statement: >-
      Every provider call's token usage (prompt and completion) is
      logged to the session record; cumulative usage is queryable per
      session, symbol, and profile.
    fit_criterion: "Usage assertions over a scripted multi-session suite."
    metric: provider calls with logged usage
    threshold: "= 100%"
    verification: test/offline/test_run_persistence.py
    priority: Should
    tradeoff: "Observability before enforcement; no caps beyond COST-001 in v1."
    source: "Methodology AI-requirement category 1 (cost governance), mapped in R2"
    status: conceptual
    depends_on: [REQ-SI-FR-011]
    regression_trigger: true
    regression_scope: [test/offline/test_session_persistence.py]

  # -----------------------------------------------------------------
  # Governance (GOV)
  # -----------------------------------------------------------------
  - id: REQ-SI-GOV-001
    type: governance
    statement: >-
      All project artifacts, documentation, stored data, and agent
      output are written in English. Sole exception: Chinese stock names
      as aliases in the symbol map.
    fit_criterion: >-
      Language check over documentation, code strings, and sampled
      outputs; non-English ratio at most 1 percent, excluding the alias
      table.
    priority: Must
    tradeoff: "Fixes the language stack and encoding safety; Chinese content deferred to REQ-SI-FR-024."
    source: "Owner requirements discussion R4 item 4"
    status: conceptual
    depends_on: []
    regression_trigger: true
    regression_scope: [test/offline/test_language_policy.py]

  - id: REQ-SI-GOV-002
    type: governance
    statement: >-
      Every change set touching source code or prompts must include an
      AI-use log update in the same change set; CI blocks merges that
      modify code or prompt paths without an AI-use log diff.
    fit_criterion: >-
      Gate test: a synthetic change modifying src/ or prompts/ without
      an AI-use log diff fails the check; with the diff it passes.
    priority: Must
    tradeoff: "Process overhead per change accepted as auditability requirement (course D1 gate)."
    source: "Course spec D7 blocking gate 6"
    status: conceptual
    depends_on: []
    regression_trigger: true
    regression_scope: [.github/workflows/ci.yml]

  - id: REQ-SI-GOV-003
    type: governance
    statement: >-
      Runtime prompts are versioned artifacts. Any prompt change is
      treated as a requirement change: reviewed, replayed against the
      evaluation set (semantic evaluation gate), and re-approved before
      reaching production.
    fit_criterion: >-
      Gate test: a prompt file change without an evaluation-set replay
      result blocks merge; the version bump is recorded in prompts/ and
      referenced in session records thereafter.
    priority: Must
    tradeoff: "Prompt agility sacrificed for eval-gated stability (methodology: changing a prompt is changing a requirement)."
    source: "Methodology section 5 (prompts as requirement artifacts); R2 item 6"
    status: conceptual
    depends_on: [REQ-SI-QA-001]
    regression_trigger: true
    regression_scope: [.github/workflows/ci.yml]

  - id: REQ-SI-GOV-004
    type: governance
    statement: >-
      The watchlist is capped at 100 active symbols. Exceeding the cap
      requires removing symbols first; the system raises an explicit
      error otherwise.
    fit_criterion: "Adding the 101st symbol fails with an explicit error; exactly 100 additions succeed."
    priority: Must
    tradeoff: "Cap bounds sync cost and keeps the watchlist meaningful for one person's weekly cadence."
    source: "Owner requirements discussion R3 item 3 (option A)"
    status: conceptual
    depends_on: [REQ-SI-FR-004]
    regression_trigger: true
    regression_scope: [test/offline/test_watchlist.py]

  - id: REQ-SI-GOV-005
    type: governance
    statement: >-
      Every session record carries model identifier, prompt version,
      analysis profile, and provider configuration stamps; turns
      inherit their session's provenance.
    fit_criterion: >-
      Zero session records with missing provenance fields across a
      scripted multi-session suite, including resumed sessions.
    priority: Must
    tradeoff: "None — consolidated from FR-011/FR-021; listed separately so CI can check completeness directly."
    source: "Course D2 ADR context requirements; R4 item 2"
    status: conceptual
    depends_on: [REQ-SI-FR-011, REQ-SI-FR-021]
    regression_trigger: true
    regression_scope: [test/offline/test_session_persistence.py]

  - id: REQ-SI-GOV-006
    type: governance
    statement: >-
      No code change merges unless the tests for the change were
      approved before implementation began. Every implementation PR
      references an approved test-plan artifact (docs/test-plans/
      TP-NNN.md with status approved); CI blocks PRs touching src/ or
      test/ that lack a valid reference. Approval preceding
      implementation is reviewer-verified from file history.
    fit_criterion: >-
      Gate test: a synthetic PR modifying src/ without a test-plan
      reference fails the approval gate; with a valid approved
      reference it passes; the gate script rejects TP files whose
      status is not approved.
    priority: Must
    tradeoff: >-
      Adds one artifact and one PR discipline per change (course
      blocking gate D7-1); mechanical ordering check is approximated
      by reviewer verification of git history - full automation
      rejected as over-engineering for a course team.
    source: "Course D7 blocking gate 1; D4 discussion round 10 (option a chosen)"
    status: conceptual
    depends_on: []
    regression_trigger: true
    regression_scope: [.github/workflows/ci.yml, tools/checks/testplan_gate.py]

  # -----------------------------------------------------------------
  # Security (SEC)
  # -----------------------------------------------------------------
  - id: REQ-SI-SEC-001
    type: security
    statement: >-
      API keys and credentials are supplied via environment variables
      or a local untracked configuration file. No secret material is
      committed to the repository.
    fit_criterion: >-
      Secret scan of working tree and history yields 0 matches for
      configured key patterns; a synthetic commit containing a fake key
      is rejected by the CI scan.
    priority: Must
    tradeoff: "None — non-negotiable hygiene."
    source: "Standard security baseline; R2 item 5 storage discussion"
    status: conceptual
    depends_on: []
    regression_trigger: true
    regression_scope: [.github/workflows/ci.yml]

  - id: REQ-SI-SEC-002
    type: security
    statement: >-
      News content is untrusted input. Layer one: sanitization
      neutralizes instruction-like content before it enters model
      context. Layer two: all model outputs touching analysis pass
      schema validation. Layer three: deterministic policy execution
      makes final decisions. No single layer is bypassable.
    fit_criterion: >-
      Adversarial corpus with embedded injection payloads: 0 payloads
      alter tool selection, watchlist state, or output policy; malformed
      outputs fail closed.
    priority: Must
    tradeoff: >-
      Three-layer defense adds pipeline stages; required by the Type-C
      classification (methodology risk list group B).
    source: "Methodology section 7.2 item 16; R2 item 4"
    status: conceptual
    depends_on: []
    regression_trigger: true
    regression_scope: [test/offline/test_injection_suite.py]

  - id: REQ-SI-SEC-003
    type: security
    statement: >-
      All data is stored locally. Outbound network traffic is limited
      to whitelisted provider and data endpoints; the agent performs no
      other network access.
    fit_criterion: >-
      Sandboxed network test: requests to non-whitelisted hosts fail
      (0 successful egress); offline mode completes all local
      operations.
    priority: Must
    tradeoff: "Local-first limits collaboration features; consistent with single-owner analysis tool."
    source: "Owner requirements discussion R2 item 5"
    status: conceptual
    depends_on: []
    regression_trigger: true
    regression_scope: [test/offline/test_egress.py]
