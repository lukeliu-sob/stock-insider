    ledger: us_pair
    text: |-
      Apple's revenue of 9.56 billion reflects solid demand for its devices.
    claims:
      - {text: "9.56 billion", correct: false, kind: wrong_field, class: growth_phrasing}  # growth rate (9.56%) stated as a revenue amount
  - id: F005
    ledger: us_pair
    text: |-
      Target Corp's revenue grew 25.2% year on year.
