      - {text: "1.18%", correct: false, kind: no_evidence, class: growth_phrasing}  # Target Corp has no data in the apple_only ledger
  - id: F012
    ledger: us_pair
    text: |-
      Apple's revenue rose 9.56% year on year to 94.0 billion in the quarter ended 30 June 2026.
