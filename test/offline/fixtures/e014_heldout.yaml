# E-014 held-out battery (TP-039), written by a separately briefed author from the frozen ledgers only.
items:
  # ---------------------------------------------------------------- growth_phrasing
  - id: F001
    ledger: us_pair
    text: |-
      Apple's revenue grew 9.56% year on year, while Target Corp's revenue fell 1.18% versus the prior-year quarter.
    claims:
      - {text: "9.56%", correct: true, kind: unit_conversion, class: growth_phrasing}
      - {text: "1.18%", correct: true, kind: unit_conversion, class: growth_phrasing}
  - id: F002
    ledger: us_pair
    text: |-
      Apple's revenue rose 9.6% from a year earlier.
    claims:
      - {text: "9.6%", correct: true, kind: rounding, class: growth_phrasing}
  - id: F003
    ledger: hk_pair
    text: |-
      Tencent's revenue was up 14.5% y-o-y, and BYD posted a 23.86% increase in revenue over the same window ending 2026-06-30.
    claims:
      - {text: "14.5%", correct: true, kind: rounding, class: growth_phrasing}
      - {text: "23.86%", correct: true, kind: unit_conversion, class: growth_phrasing}
      - {text: "2026-06-30", correct: true, kind: temporal, class: growth_phrasing}
