    ledger: hk_pair
    text: |-
      Tencent's revenue grew 23.9% year on year.
    claims:
      - {text: "23.9%", correct: false, kind: misattributed, class: growth_phrasing}  # 23.86% is BYD's revenue growth; Tencent's is 14.53%
  - id: F007
    ledger: us_pair
    text: |-
      Target Corp's revenue declined by 1.2% versus the prior-year quarter, while Apple's top line expanded 9.557%.
    claims:
      - {text: "1.2%", correct: true, kind: rounding, class: growth_phrasing}
      - {text: "9.557%", correct: true, kind: rounding, class: growth_phrasing}
  - id: F008
    ledger: us_pair
    text: |-
      Target's revenue fell 1.20% from a year earlier.
    claims:
      - {text: "1.20%", correct: false, kind: over_precise, class: growth_phrasing}  # ledger -1.176% rounds to 1.18% at two decimals, not 1.20%
  - id: F009
    ledger: hk_pair
    text: |-
      BYD's revenue grew 14.53% year on year.
    claims:
      - {text: "14.53%", correct: false, kind: misattributed, class: growth_phrasing}  # 14.53% is Tencent's revenue growth; BYD's is 23.86%
  - id: F010
    ledger: hk_pair
    text: |-
      Tencent's revenue climbed 14.52% from the prior-year period.
    claims:
      - {text: "14.52%", correct: false, kind: over_precise, class: growth_phrasing}  # Tencent growth 14.5251% rounds to 14.53%; 14.52% is BYD's volatility
  - id: F011
    ledger: apple_only
    text: |-
      Apple's sales growth came in at 9.56% for the year to 2026-06-30, against Target's revenue decline of 1.18%.
